<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Causal Schedule Lab 可缩放项目图</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #eef3f7;
      --panel: #ffffff;
      --canvas: #f7fafc;
      --text: #17212b;
      --muted: #5b6b79;
      --border: #c7d2dc;
      --edge: #73879a;
      --active: #176b87;
      --active-soft: #d9eef5;
      --partial: #8a5b13;
      --partial-soft: #f7ebcc;
      --planned: #6d5b8f;
      --planned-soft: #ebe5f5;
      --group: rgba(77, 111, 135, 0.06);
      --shadow: rgba(25, 45, 60, 0.12);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #10171d;
        --panel: #182129;
        --canvas: #111a21;
        --text: #e7eef4;
        --muted: #a8b5c0;
        --border: #3b4a56;
        --edge: #7f95a7;
        --active: #74c7df;
        --active-soft: #193b48;
        --partial: #e4b564;
        --partial-soft: #48391d;
        --planned: #c1ace5;
        --planned-soft: #342b46;
        --group: rgba(163, 194, 214, 0.05);
        --shadow: rgba(0, 0, 0, 0.35);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
    }
    .shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
      display: flex;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    h1 { font-size: 18px; margin: 0; font-weight: 600; }
    .toolbar, .tabs {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    button {
      appearance: none;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--panel);
      color: var(--text);
      padding: 7px 11px;
      font: inherit;
      cursor: pointer;
    }
    button:hover { border-color: var(--active); }
    button:focus-visible { outline: 3px solid var(--active-soft); }
    button[aria-pressed="true"] {
      background: var(--active-soft);
      border-color: var(--active);
      color: var(--text);
    }
    .zoom-value {
      min-width: 58px;
      text-align: center;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    #viewport {
      position: relative;
      flex: 1;
      min-height: 720px;
      overflow: hidden;
      background:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px),
        var(--canvas);
      background-size: 32px 32px;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }
    #viewport.dragging { cursor: grabbing; }
    #canvas {
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: 0 0;
    }
    #edge-layer {
      position: absolute;
      inset: 0;
      overflow: visible;
      pointer-events: none;
    }
    .group {
      position: absolute;
      border: 1px dashed var(--border);
      border-radius: 14px;
      background: var(--group);
      padding: 14px;
      pointer-events: none;
    }
    .group-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }
    .node {
      position: absolute;
      width: 220px;
      min-height: 68px;
      border: 1px solid var(--border);
      border-left-width: 5px;
      border-radius: 10px;
      background: var(--panel);
      box-shadow: 0 5px 14px var(--shadow);
      padding: 10px 12px;
      cursor: pointer;
      user-select: none;
    }
    .node:hover, .node.selected { border-color: var(--active); }
    .node.active { border-left-color: var(--active); }
    .node.partial { border-left-color: var(--partial); }
    .node.planned { border-left-color: var(--planned); }
    .node-title { font-size: 14px; font-weight: 600; margin-bottom: 5px; }
    .node-detail { font-size: 12px; color: var(--muted); line-height: 1.4; }
    .node-status {
      display: inline-block;
      margin-top: 7px;
      padding: 2px 6px;
      border-radius: 999px;
      font-size: 11px;
    }
    .active .node-status { background: var(--active-soft); color: var(--text); }
    .partial .node-status { background: var(--partial-soft); color: var(--text); }
    .planned .node-status { background: var(--planned-soft); color: var(--text); }
    .edge {
      fill: none;
      stroke: var(--edge);
      stroke-width: 2;
      marker-end: url(#arrow);
    }
    .edge.highlight { stroke: var(--active); stroke-width: 4; }
    footer {
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding: 9px 18px;
      color: var(--muted);
      font-size: 13px;
      min-height: 38px;
    }
    @media (max-width: 720px) {
      header { align-items: flex-start; }
      #viewport { min-height: 620px; }
    }
  </style>
</head>

  <main class="shell">
    <header>
      <div>
        <h1>Causal Schedule Lab · 可缩放项目图</h1>
        <div class="tabs" aria-label="图层选择">

          <button id="detail-tab" type="button" aria-pressed="false">第二层：实现细节</button>
          <button id="pipeline-tab" type="button" aria-pressed="false">第三层：真实组件映射</button>
        </div>
      </div>
      <div class="toolbar" aria-label="视图控制">
        <button id="zoom-out" type="button" aria-label="缩小">−</button>
        <span id="zoom-value" class="zoom-value">100%</span>
        <button id="zoom-in" type="button" aria-label="放大">＋</button>
        <button id="fit" type="button">适应窗口</button>
        <button id="reset" type="button">重置</button>
        <button id="fullscreen" type="button">全屏</button>
      </div>
    </header>
    <section id="viewport" aria-label="可缩放、可拖拽项目模块图">
      <div id="canvas">
        <svg id="edge-layer" aria-hidden="true"></svg>
      </div>
    </section>
    <footer id="detail-line">滚轮缩放 · 拖拽平移 · 点击节点查看模块说明</footer>
  </main>

          ["D.impl.7", "[D12] Out-of-catalog Proposed Pool", "新次级目标/新诊断，仅待审核候选", "active", 1340, 360, "g3b"],
          ["D.impl.3", "[D3–D4] Mechanisms + Calculators", "机制定义与确定性计算入口", "partial", 860, 585, "g3b"],
          ["D.impl.4", "[D5–D6] Variation + Control Gates", "候选变化与直接/验证间接可控性资格门", "partial", 1100, 585, "g3b"],
          ["D.impl.5", "[D7] Factor–Mechanism Path", "第二阶段入口；保存 factor→mechanism→objective 路径接口，不等于已完成因果识别", "partial", 1340, 585, "g3b"],

          ["E.impl.1", "[D1–D2] Schedule Graph + CIP", "当前排程图、诊断点、责任点、路径与闭包", "active", 1650, 135, "g3c"],
          ["E.impl.2", "[E1–E2] Ranker + Action Mask", "规则/GNN 接口排序与合法动作过滤", "partial", 1890, 135, "g3c"],
          ["E.impl.3", "[E3–E5] Operators + Search + Generator", "算子、VNS/ALNS/Tabu 与条件候选生成", "partial", 2130, 135, "g3c"],
          ["E.impl.4", "[E6] Bounded CP-SAT Repair", "闭包外冻结的确定性局部修复", "active", 2130, 360, "g3c"],

          ["V.impl.1", "[F1–F2] Code + Static Gates", "证据门与统一 IR 硬约束验证", "active", 2440, 135, "g3d"],
          ["V.impl.2", "[F3–F5] Proxy + Domain Oracle + Cost", "轻量代理、项目完整验证接口、合法性和成本记录", "active", 2680, 135, "g3d"],
          ["V.impl.3", "[G1–G2] Objective + Strict Gate", "词典序正式目标与严格改善判断", "active", 2920, 135, "g3d"],
          ["V.impl.4", "[G3–G4] Accept / Revert", "接受新 incumbent 或拒绝并恢复", "active", 2920, 360, "g3d"],
          ["V.impl.5", "[H1–H6] Records + Posterior + Statistics", "干预、成本、反事实、数据集、统计后验与重放审计", "partial", 2920, 585, "g3d"]
        ],
        edges: [
          ["B.impl.1", "B.impl.2"], ["B.impl.1", "B.impl.4"],
          ["B.impl.3", "B.impl.1"], ["B.impl.5", "B.impl.6"], ["B.impl.6", "B.impl.4"],
          ["B.impl.4", "D.impl.6"], ["B.impl.4", "B.impl.7"], ["B.impl.7", "D.impl.7"], ["D.impl.6", "D.impl.1"], ["D.impl.6", "D.impl.2"],
          ["D.impl.3", "D.impl.4"], ["D.impl.4", "D.impl.5"],
          ["E.impl.1", "E.impl.2"], ["D.impl.5", "E.impl.2"],
          ["E.impl.2", "E.impl.3"], ["E.impl.3", "E.impl.4"],
          ["E.impl.4", "V.impl.1"], ["V.impl.1", "V.impl.2"],
          ["V.impl.2", "V.impl.3"], ["V.impl.3", "V.impl.4"],
          ["V.impl.4", "V.impl.5"]
        ]
      };

      const viewport = document.getElementById("viewport");
      const canvas = document.getElementById("canvas");
      const edgeLayer = document.getElementById("edge-layer");
      const zoomValue = document.getElementById("zoom-value");
      const detailLine = document.getElementById("detail-line");
      const macroTab = document.getElementById("macro-tab");
      const detailTab = document.getElementById("detail-tab");
      const pipelineTab = document.getElementById("pipeline-tab");
      const requestedView = new URLSearchParams(location.search).get("view");
      let mode = ["macro", "detail", "pipeline"].includes(requestedView)
        ? requestedView
        : "macro";
      let scale = 1;
      let tx = 0;
      let ty = 0;
      let dragging = false;
      let lastX = 0;
      let lastY = 0;
      let selected = null;

      const data = () => mode === "macro" ? macro : mode === "detail" ? detail : pipeline;
      const nodeMap = () => new Map(data().nodes.map(n => [n[0], n]));

      function applyTransform() {
        canvas.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
        zoomValue.textContent = `${Math.round(scale * 100)}%`;
      }

      function drawEdges() {
        edgeLayer.innerHTML = `
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
              markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--edge)"></path>
            </marker>
          </defs>`;
        const map = nodeMap();
        for (const [from, to] of data().edges) {
          const a = map.get(from);
          const b = map.get(to);
          if (!a || !b) continue;
          const aElement = canvas.querySelector(`.node[data-id="${CSS.escape(from)}"]`);
          const bElement = canvas.querySelector(`.node[data-id="${CSS.escape(to)}"]`);
          if (!aElement || !bElement) continue;
          let ax;
          let ay;
          let bx;
          let by;
          let path;
          if (Math.abs(b[4] - a[4]) < 30) {
            ax = aElement.offsetLeft + aElement.offsetWidth / 2;
            ay = aElement.offsetTop + aElement.offsetHeight;
            bx = bElement.offsetLeft + bElement.offsetWidth / 2;
            by = bElement.offsetTop;
            const midY = (ay + by) / 2;
            path = `M ${ax} ${ay} V ${midY} H ${bx} V ${by}`;
          } else {
            ax = aElement.offsetLeft + aElement.offsetWidth;
            ay = aElement.offsetTop + aElement.offsetHeight / 2;
            bx = bElement.offsetLeft;
            by = bElement.offsetTop + bElement.offsetHeight / 2;
            const midX = (ax + bx) / 2;
            path = `M ${ax} ${ay} H ${midX} V ${by} H ${bx}`;
          }
          const element = document.createElementNS("http://www.w3.org/2000/svg", "path");
          element.setAttribute("d", path);
          element.setAttribute("class", "edge");
          element.dataset.from = from;
          element.dataset.to = to;
          edgeLayer.appendChild(element);
        }
      }

      function render() {
        selected = null;
        detailLine.textContent = "滚轮缩放 · 拖拽平移 · 点击节点查看模块说明";
        canvas.querySelectorAll(".group, .node").forEach(el => el.remove());
        canvas.style.width = `${data().width}px`;
        canvas.style.height = `${data().height}px`;
        edgeLayer.setAttribute("width", data().width);
        edgeLayer.setAttribute("height", data().height);
        for (const group of data().groups) {
          const el = document.createElement("section");
          el.className = "group";
          el.style.left = `${group[2]}px`;
          el.style.top = `${group[3]}px`;
          el.style.width = `${group[4]}px`;
          el.style.height = `${group[5]}px`;
          el.innerHTML = `<div class="group-title">${group[1]}</div>`;
          canvas.appendChild(el);
        }
        for (const node of data().nodes) {
          const el = document.createElement("article");
          el.className = `node ${node[3]}`;
          el.dataset.id = node[0];
          el.style.left = `${node[4]}px`;
          el.style.top = `${node[5]}px`;
          el.innerHTML = `
            <div class="node-title">${node[0]} · ${node[1]}</div>
            <div class="node-detail">${node[2]}</div>
            <span class="node-status">${STATUS[node[3]]}</span>`;
          el.addEventListener("click", event => {
            event.stopPropagation();
            selectNode(node[0]);
          });
          canvas.appendChild(el);
        }
        drawEdges();
        fitView();
      }

      function selectNode(id) {
        selected = id;
        canvas.querySelectorAll(".node").forEach(el => {
          el.classList.toggle("selected", el.dataset.id === id);
        });
        edgeLayer.querySelectorAll(".edge").forEach(el => {
          el.classList.toggle(
            "highlight",
            el.dataset.from === id || el.dataset.to === id
          );
        });
        const node = nodeMap().get(id);
        detailLine.textContent = `${node[0]} · ${node[1]} — ${node[2]} — ${STATUS[node[3]]}`;
      }

      function fitView() {
        const rect = viewport.getBoundingClientRect();
        const padding = 42;
        scale = Math.min(
          (rect.width - padding * 2) / data().width,
          (rect.height - padding * 2) / data().height,
          1.4
        );
        scale = Math.max(0.15, scale);
        tx = (rect.width - data().width * scale) / 2;
        ty = (rect.height - data().height * scale) / 2;
        applyTransform();
      }

      function zoomAt(nextScale, clientX, clientY) {
        const rect = viewport.getBoundingClientRect();
        const px = clientX - rect.left;
        const py = clientY - rect.top;
        const canvasX = (px - tx) / scale;
        const canvasY = (py - ty) / scale;
        scale = Math.min(3.5, Math.max(0.15, nextScale));
        tx = px - canvasX * scale;
        ty = py - canvasY * scale;
        applyTransform();
      }

      viewport.addEventListener("wheel", event => {
        event.preventDefault();
        zoomAt(scale * (event.deltaY < 0 ? 1.12 : 0.89), event.clientX, event.clientY);
      }, { passive: false });
      viewport.addEventListener("pointerdown", event => {
        if (event.target.closest(".node")) return;
        dragging = true;
        lastX = event.clientX;
        lastY = event.clientY;
        viewport.classList.add("dragging");
        viewport.setPointerCapture(event.pointerId);
      });
      viewport.addEventListener("pointermove", event => {
        if (!dragging) return;
        tx += event.clientX - lastX;
        ty += event.clientY - lastY;
        lastX = event.clientX;
        lastY = event.clientY;
        applyTransform();
      });
      viewport.addEventListener("pointerup", event => {
        dragging = false;
        viewport.classList.remove("dragging");
        if (viewport.hasPointerCapture(event.pointerId)) {
          viewport.releasePointerCapture(event.pointerId);
        }
      });
      viewport.addEventListener("click", () => {
        if (selected) selectNode(selected);
      });

      document.getElementById("zoom-in").addEventListener("click", () => {
        const rect = viewport.getBoundingClientRect();
        zoomAt(scale * 1.2, rect.left + rect.width / 2, rect.top + rect.height / 2);
      });
      document.getElementById("zoom-out").addEventListener("click", () => {
        const rect = viewport.getBoundingClientRect();
        zoomAt(scale / 1.2, rect.left + rect.width / 2, rect.top + rect.height / 2);
      });
      document.getElementById("fit").addEventListener("click", fitView);
      document.getElementById("reset").addEventListener("click", () => {
        scale = 1;
        tx = 35;
        ty = 35;
        applyTransform();
      });
      document.getElementById("fullscreen").addEventListener("click", async () => {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
        setTimeout(fitView, 100);
      });
      macroTab.addEventListener("click", () => {
        mode = "macro";
        macroTab.setAttribute("aria-pressed", "true");
        detailTab.setAttribute("aria-pressed", "false");
        pipelineTab.setAttribute("aria-pressed", "false");
        render();
      });
      detailTab.addEventListener("click", () => {
        mode = "detail";
        macroTab.setAttribute("aria-pressed", "false");
        detailTab.setAttribute("aria-pressed", "true");
        pipelineTab.setAttribute("aria-pressed", "false");
        render();
      });
      pipelineTab.addEventListener("click", () => {
        mode = "pipeline";
        macroTab.setAttribute("aria-pressed", "false");
        detailTab.setAttribute("aria-pressed", "false");
        pipelineTab.setAttribute("aria-pressed", "true");
        render();
      });
      window.addEventListener("resize", fitView);
      macroTab.setAttribute("aria-pressed", mode === "macro" ? "true" : "false");
      detailTab.setAttribute("aria-pressed", mode === "detail" ? "true" : "false");
      pipelineTab.setAttribute("aria-pressed", mode === "pipeline" ? "true" : "false");
      render();
    })();
  </script>
</body>
</html>
