[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-schedule-lab"
version = "0.7.4"
description = "Domain-independent project-conditioned causal and agentic schedule improvement laboratory"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "ortools>=9.12,<10",
  "pydantic>=2.13,<3",
  "pypdf>=5,<7",
  "scipy>=1.14,<2",
  "torch>=2.13,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
]

[project.scripts]
causal-schedule-lab = "causal_schedule_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
causal_schedule_lab = [
  "knowledge/*.json",
  "knowledge/secondary_metrics/round3/*.json",
  "knowledge/secondary_metrics/round3/*.jsonl",
  "knowledge/secondary_metrics/round4/*.json",
  "knowledge/secondary_metrics/round4/*.jsonl",
  "knowledge/secondary_metrics/round5/*",
  "knowledge/secondary_metrics/round6/*",
  "knowledge/secondary_metrics/compatibility/*.json",
  "knowledge/secondary_metrics/compatibility/*.jsonl",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["external_cases", ".git", ".venv", "outputs"]
